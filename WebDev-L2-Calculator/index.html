<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <main class="calculator">

        <header class="calculator-header">
            <h1>Calculator</h1>
        </header>

        <section class="screen" aria-label="Calculator display">
            <div id="history"></div>
            <output id="display"
                    aria-live="polite">0</output>
        </section>

        <section class="buttons" aria-label="Calculator buttons">

            <button class="clear" data-action="clear">C</button>
            <button data-action="backspace">DEL</button>
            <button class="operator" data-value="÷">÷</button>
            <button class="operator" data-value="×">×</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="−">−</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="+">+</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="equals" data-action="equals">=</button>

            <button class="zero" data-value="0">0</button>
            <button data-value=".">.</button>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
